# The station in the station-against-AP topology: the fuzzing build, and the
# one that sends. Every mutation on the air comes from here.
#
# Build from wpa_supplicant/defconfig-fuzz.
ctrl_interface=@RUNDIR@/wpa_supplicant
update_config=0

# Keep retrying. A mutated Authentication or Association frame will often get
# the station refused, and a station that gave up after the first refusal
# would send one case per run.
ap_scan=1

# Group 19 matches the AP. sae_groups is global in wpa_supplicant, not a
# network field. The whole group registry is W2's domain and is swept there,
# by configuration, not from here.
sae_groups=19

# Each fuzz case costs one association, and each association costs a scan.
# Scanning the whole band between cases is most of a run's wall clock and
# none of its coverage, so the station is told where the AP is. This is a
# property of the topology -- one AP, known channel -- not a filter on what
# gets sent.
freq_list=2437

# And let a cached scan result stand in for a fresh scan, so most cases cost
# an association and nothing else. The default is five seconds, which at this
# cadence means a full scan between almost every pair of cases.
scan_res_valid_for_connect=3600

network={
	ssid="hostap-fuzz-net"
	key_mgmt=SAE
	sae_password="fuzzfuzzfuzz"
	ieee80211w=2
}
