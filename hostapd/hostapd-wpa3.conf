# WPA3-Personal (SAE) access point for fuzzing runs.
#
# Driven by ../monitor_fuzzing.py, which starts hostapd with this file, decodes
# the [fuzz] JSON lines, and records the case in flight if hostapd dies.
#
# Fuzzing tunables are read from the environment, not from this file:
#   FUZZ_START_CASE=N        resume every target at case N (skips the warm-up)
#   FUZZ_START_<TARGET>=N    resume one target, e.g. FUZZ_START_AUTH_SAE=1234
#   FUZZ_DISCONNECT_MS=N     delay before forcing the STA off (default 1000)
#   FUZZ_DISCONNECT_MS=0     leave the STA connected, so the group key
#                            handshake, rekey and data path get fuzzed too

# Set this to your own AP-capable interface before the first run.
interface=wlan0
driver=nl80211

ssid=hostapd-fuzz
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# WPA3-Personal: SAE only, no PSK fallback, management frame protection
# required. This is what makes the SAE auth exchange the code path under test.
wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
sae_password=fuzzfuzzfuzz
ieee80211w=2
sae_require_mfp=1

# group 19 (P-256) is the mandatory one and what most clients pick first;
# sae_pwe=2 accepts both hunting-and-pecking and hash-to-element so a wider
# range of clients will actually complete the exchange.
sae_groups=19
sae_pwe=2

# The monitor reads hostapd's stdout, so keep logging there.
logger_stdout=-1
logger_stdout_level=2

# Needed for harness-driven disconnects (see fix plan 2.4 / 3.2).
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
