# The AP in the station-against-AP topology: WPA3-Personal, and deliberately
# NOT a fuzzing build. It transmits nothing mutated. It is here to parse what
# the station sends and, if a frame finds something, to die -- which is the
# only detection this harness has and the only one it wants.
#
# Build it from hostapd/defconfig (plus CONFIG_SAE and the AC/AX/BE trio this
# upstream will not link without), with ASan:
#
#   make clean
#   make CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
#        LDFLAGS="-fsanitize=address"
#
# The interface name is substituted by topology/sta-vs-ap.sh, which reads it
# back from the kernel rather than assuming wlan0.
interface=@AP_IFACE@
driver=nl80211

ssid=hostap-fuzz-net
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
sae_password=fuzzfuzzfuzz
# WNM. hostapd only takes the WNM-Sleep Mode Response and BSS Transition
# Management Request paths when a station asks and the AP is willing, so
# without these two the hooks in src/ap/wnm_ap.c are never reached: the frames
# are not under-fuzzed, they are absent. Needs CONFIG_WNM=y in the build.
wnm_sleep_mode=1
bss_transition=1

ieee80211w=2
sae_require_mfp=1

sae_groups=19
sae_pwe=2

logger_stdout=-1
logger_stdout_level=2

ctrl_interface=@RUNDIR@/hostapd
ctrl_interface_group=0
