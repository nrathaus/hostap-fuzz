# Both ends of the mesh topology use this file. Each is a fuzzing build, so
# each mutates the peering frames it sends and each parses what the other
# sends -- the one topology where the subject and the victim are the same
# program and neither side is a stock reference.
#
# That symmetry is the point and also the catch: a crash here does not say
# which end's mutation caused it, only that one of them did. The ledgers are
# written separately so the two runs can be told apart afterwards.
ctrl_interface=@RUNDIR@/wpa_supplicant
update_config=0
user_mpm=1

network={
	ssid="hostap-fuzz-mesh"
	mode=5
	frequency=2412
	key_mgmt=SAE
	sae_password="fuzzfuzzfuzz"
	ieee80211w=2
}
